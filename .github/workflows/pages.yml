# Compila el frontend con Vite y lo publica en GitHub Pages.
# Pages solo sirve archivos estáticos, así que el catálogo del backend
# se publica como JSON junto al sitio (api/videojuegos.json).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_URL_API: api/videojuegos.json

      - name: Copiar catálogo como JSON estático
        run: |
          mkdir -p dist/api
          cp ../backend/data/videojuegos.json dist/api/videojuegos.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
